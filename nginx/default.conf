server {
    listen 80;
    server_name _;

    # Serve React app (static files)
    root /usr/share/nginx/html;
    index index.html;

    # All frontend routes → React
    location / {
        try_files $uri /index.html;
    }

    # Backend API – proxy to Node (Docker on port 3000)
    location /auth {
        proxy_pass http://127.0.0.1:3000;  # /auth/login -> http://127.0.0.1:3000/auth/login
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /s3 {
        proxy_pass http://127.0.0.1:3000;  # /s3/presign -> http://127.0.0.1:3000/s3/presign
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /protected-route {
        proxy_pass http://127.0.0.1:3000;  # /protected-route -> http://127.0.0.1:3000/protected-route
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
